name: ci

# Build the crate on desktop hosts, cross-check mobile/web Rust, and exercise the bundled demo.
on:
  push:
    branches: ["**"]
    tags: ["v[0-9]+.[0-9]+.[0-9]+*"]
  pull_request:
  workflow_dispatch:
  schedule:
    # Daily: day's main moves on weeks nobody pushes here.
    - cron: "0 10 * * *"

# The repository's own jobs run this checkout's code with a read-only token. The write grants
# sit on the job that calls the shared workflow, whose release and Pages jobs alone use them;
# its build legs, which run this code too, narrow their token to read-only themselves.
permissions:
  contents: read

jobs:
  host:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest, features: gtk, packages: "libgtk-4-media-gstreamer gstreamer1.0-plugins-good gstreamer1.0-libav" }
          - { os: ubuntu-latest, features: qt, packages: "qt6-multimedia-dev" }
          - { os: macos-15, features: appkit }
          - { os: windows-latest, features: winui }
          - { os: windows-latest, features: xaml }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - name: Install the toolkit and media libraries
        if: runner.os == 'Linux'
        # Day owns toolkit prerequisites, including SVG; this piece adds playback libraries.
        uses: daybrite/actions/.github/actions/setup-day-deps@v1
        with:
          target: linux-${{ matrix.features }}
          pack: false
          extras: false
          packages: ${{ matrix.packages }}
      - run: cargo fmt --all -- --check
        if: matrix.features == 'gtk'
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo clippy --features ${{ matrix.features }} -- -D warnings
      - run: cargo test
      - uses: actions/setup-node@v6
        if: matrix.features == 'gtk'
        with:
          node-version: '22'
      - run: node --test tests/browser.mjs
        if: matrix.features == 'gtk'

  # The mobile and web arms compile for their targets. A link is not attempted here (the demo
  # below does that inside a real app), but an objc2 call that no longer type-checks, a JNI
  # signature drift in the Android arm, or a wasm-only API change fails here in a minute.
  cross-check:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-15, target: aarch64-apple-ios-sim, features: uikit }
          - { os: ubuntu-latest, target: aarch64-linux-android, features: material }
          # The getrandom backend cfg is what `day build` sets for every web app; without it
          # getrandom refuses to compile for wasm32-unknown-unknown.
          - { os: ubuntu-latest, target: wasm32-unknown-unknown, features: dom, rustflags: '--cfg getrandom_backend="custom"' }
    runs-on: ${{ matrix.os }}
    env:
      RUSTFLAGS: ${{ matrix.rustflags }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - run: cargo clippy --target ${{ matrix.target }} --features ${{ matrix.features }} -- -D warnings

  demo:
    uses: daybrite/actions/.github/workflows/dayapp.yml@v1
    permissions:
      contents: write # release-asset upload on tag builds
    secrets: inherit
    with:
      project-path: demo
      targets: macos-appkit, linux-gtk, linux-qt, windows-winui, ios-uikit, android-material, web-dom, harmony-arkui
      update-day-deps: true
      scripts: dayscript/walkthrough.yaml
      target-scripts: |
        android-material: dayscript/walkthrough.yaml dayscript/android-lifecycle.yaml
        macos-appkit, linux-gtk, linux-qt: dayscript/walkthrough.yaml dayscript/shared-window.yaml
        windows-winui: dayscript/walkthrough.yaml dayscript/shared-window.yaml
      preflight-checks: fmt, clippy, test
      # Audio-only MediaPlayer playback needs Windows audio services and an output
      # endpoint even at volume zero. Log endpoint availability before the walkthrough.
      target-setup: |
        windows-winui: powershell.exe -NoProfile -ExecutionPolicy Bypass -File scripts/ci/windows-audio.ps1
      # The Linux players need more than the toolkit the shared workflow installs: GStreamer's
      # codecs for the bundled clip on both, GTK's GStreamer media module, and Qt Multimedia
      # (without it the Qt build falls back to a URL label).
      target-packages: |
        linux-gtk, linux-qt: gstreamer1.0-plugins-good gstreamer1.0-libav
        linux-gtk: libgtk-4-media-gstreamer
        linux-qt: qt6-multimedia-dev
      ios-devices: |
        device=iPhone, orientation=portrait
      android-devices: |
        device=pixel_7,     os=36, orientation=portrait
