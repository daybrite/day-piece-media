[package]
name = "day-piece-media"
publish = false
version = "0.4.3"
edition = "2024"
rust-version = "1.89"
description = "Native audio and video playback for Day applications"
repository = "https://github.com/daybrite/day-piece-media"
license = "MPL-2.0"
build = "build.rs"

# A standalone Day Piece wrapping each toolkit's native media player (AVPlayerView on AppKit, a
# hand-rolled AVPlayerViewController on UIKit, QMediaPlayer + QVideoWidget on Qt,
# android.widget.VideoView on Android, GtkVideo on GTK). Like `day-piece-webview`, it carries both
# its cross-platform front-end (Rust) and its per-toolkit backend (objc2 / C++ shim / Android Java /
# gtk-rs) without touching any core day crate. See docs/extending.md + docs/media.md.

[features]
appkit = ["dep:day-appkit", "dep:objc2", "dep:objc2-app-kit", "dep:objc2-foundation", "dep:objc2-core-media", "dep:objc2-av-kit", "dep:objc2-av-foundation", "dep:dispatch2"]
# GtkVideo is core GTK, so the gtk feature compiles everywhere, but actual playback needs gtk4
# built with a gstreamer media backend (Debian/Fedora default). Homebrew's gtk4 ships none, so on
# macos-gtk GtkVideo shows its own "no media backend" error UI (the webkitgtk caveat class again).
gtk = ["dep:day-gtk", "dep:gtk4"]
qt = ["dep:day-qt"]                 # + build.rs compiles src/lib-qt-shim.cpp, linking Qt6MultimediaWidgets when present (else a URL-label fallback)
# objc2-av-kit 0.3 binds AVPlayerView for macOS only, so UIKit hand-rolls AVPlayerViewController
# via extern_class!/msg_send! (the WKWebView-on-iOS situation); see [package.metadata.day.ios].
uikit = ["dep:day-uikit", "dep:objc2", "dep:objc2-ui-kit", "dep:objc2-foundation", "dep:objc2-core-media", "dep:objc2-av-foundation", "dep:dispatch2"]
mdc = ["dep:day-android"]        # + [package.metadata.day.android]
# HarmonyOS: no native node kind to construct, so the piece ships its ArkTS
# (platform/harmony/ets/Index.ets, an ArkUI `Video` component for pictures and an AVPlayer for
# sound only), staged into the app's hvigor project through [package.metadata.day.ohos], the same
# route the webview takes.
arkui = ["dep:day-arkui"]        # + [package.metadata.day.ohos]
# XAML: build.rs compiles src/lib-xaml-shim.cpp (a MediaPlayerElement boxed via day-xaml-sys's
# day_xaml_box functions, like the picker/webview xaml pieces). mock has no renderer. Its feature
# exists so apps can enable `day-piece-media/mock` uniformly; the media kind then falls back to
# day's placeholder leaf.
xaml = ["dep:day-xaml", "dep:day-xaml-sys"]
# Web: a plain <video>. Registered at runtime rather than link-time, because wasm has no `linkme`
# distributed slice (see lib-dom.rs), so the piece registers itself from its constructor.
dom = ["dep:day-dom"]
mock = []

# Backends this piece carries a native-renderer [features] entry for. `day` unions `<pkg>/<backend>`
# into an app build (Tier A.2), so an app depends on this piece with a plain `{ workspace = true }`,
# with no per-backend feature fan-out in its Cargo.toml.
[package.metadata.day]
compat = "0.4"

[package.metadata.day.piece]
backends = ["appkit", "gtk", "qt", "uikit", "mdc", "xaml", "arkui", "dom", "mock"]

[dependencies]
day-bridge = { git = "https://github.com/daybrite/day.git" }
day-spec = { git = "https://github.com/daybrite/day.git" }
day-core = { git = "https://github.com/daybrite/day.git" }
day-pieces = { git = "https://github.com/daybrite/day.git" }
day-reactive = { git = "https://github.com/daybrite/day.git" }
linkme = { version = "0.3" }
log = { version = "0.4" }
day-appkit = { git = "https://github.com/daybrite/day.git", optional = true }
day-gtk = { git = "https://github.com/daybrite/day.git", optional = true }
day-qt = { git = "https://github.com/daybrite/day.git", optional = true }
day-uikit = { git = "https://github.com/daybrite/day.git", optional = true }
day-android = { git = "https://github.com/daybrite/day.git", optional = true }
day-arkui = { git = "https://github.com/daybrite/day.git", optional = true }
day-xaml = { git = "https://github.com/daybrite/day.git", optional = true }
day-xaml-sys = { git = "https://github.com/daybrite/day.git", optional = true }
gtk4 = { version = "0.11", optional = true }
day-dom = { git = "https://github.com/daybrite/day.git", optional = true }
objc2 = { version = "0.6", optional = true }
objc2-app-kit = { version = "0.3", optional = true, features = ["NSView", "NSResponder"] }
objc2-ui-kit = { version = "0.3", optional = true, features = ["UIView", "UIViewController", "UIResponder"] }
objc2-foundation = { version = "0.3", optional = true, features = ["NSString", "NSURL", "NSNotification", "NSKeyValueObserving", "NSError", "NSDictionary", "NSArray", "NSEnumerator"] }
objc2-core-media = { version = "0.3", optional = true, features = ["CMTime"] }
objc2-av-kit = { version = "0.3", optional = true, features = ["AVPlayerView", "objc2-app-kit", "objc2-av-foundation"] }
# The timed-metadata output (docs/media.md): the stream's own "now playing", delivered by
# AVFoundation on a dispatch queue, hence dispatch2 for the main queue.
objc2-av-foundation = { version = "0.3", optional = true, features = ["AVPlayer", "AVPlayerItem", "AVTime", "objc2-core-media", "AVPlayerItemOutput", "AVPlayerItemTrack", "AVMetadataItem", "AVTimedMetadataGroup", "AVMetadataIdentifiers", "AVMetadataFormat", "dispatch2"] }
dispatch2 = { version = "0.3", optional = true }
# The side probe of a stream's in-band metadata where the native player keeps it to itself
# (src/icy.rs): one short request with `Icy-MetaData: 1`, through the platform's HTTP stack.
day-part-http = { git = "https://github.com/daybrite/day.git" }

[build-dependencies]
day-build = { git = "https://github.com/daybrite/day.git" }
day-toolchain = { git = "https://github.com/daybrite/day.git" }
cc = "1"

[dev-dependencies]
day-mock = { git = "https://github.com/daybrite/day.git" }

# Standalone-piece Android contribution (docs/extending.md). The day CLI reads this from
# `cargo metadata` and folds it into the app's Gradle build; the piece carries its backend
# Java and declares the Android permissions it needs, without touching day-android or the scaffold.
[package.metadata.day.android]
# Java/Kotlin sources, relative to this crate root: dirs, or single files linked in by package.
java = ["src/DayMedia.java"]
# Gradle dependency coordinates added to the app module. android.widget.VideoView + MediaController
# are framework widgets, so no extra dependency is required (androidx.media3/ExoPlayer is the later
# upgrade for reliable HLS/DASH playback, via this same key).
gradle-dependencies = []
# Extra Maven repositories (URLs) for dependencies not on google()/mavenCentral().
gradle-repositories = []
# Android manifest <uses-permission>s the piece needs, merged into the app manifest by `day build`
# (network media sources need INTERNET; local files need nothing).
permissions = ["android.permission.INTERNET"]

# --- HarmonyOS backend contribution (docs/extending.md) ---
# The ArkTS half of the piece, staged into the app's hvigor project by `day build`.
[package.metadata.day.ohos]
ets = ["platform/harmony/ets"]

# --- iOS backend contribution (docs/extending.md) ---
# The iOS AVPlayerViewController is hand-rolled in Rust (objc2), so there's no Swift shim, but its
# ObjC class lives in AVKit.framework (and AVPlayer in AVFoundation.framework), which the app must
# link. Declaring them here links them via the generated DayPieces SwiftPM package.
[package.metadata.day.ios]
# CoreMedia carries kCMTimeZero (used by the looping seek); objc2-core-media's Rust framework
# link is ignored by xcodebuild, so the app links it here too.
# AVFAudio carries AVAudioSession, which the UIKit arm puts in the `playback` category so sound
# keeps going with the ring switch on and (with the app's `UIBackgroundModes` audio entry) in the
# background; the audio session is per process, and a media player is what needs one.
frameworks = ["AVKit", "AVFoundation", "CoreMedia", "AVFAudio"]

# --- macOS backend contribution ---
# The same frameworks for the same reason once the platform/macos/ Xcode host project drives
# the final link (§17.4): xcodebuild reads no Rust link metadata, so the generated DayPieces
# package declares them. The cargo-driven build keeps linking them itself; the duplicate
# declaration is harmless there.
[package.metadata.day.macos]
frameworks = ["AVKit", "AVFoundation", "CoreMedia"]

# --- AppImage launcher default (docs/extending.md) ---
# linuxdeploy bundles libgstreamer but none of GStreamer's element plugins, and the bundled library
# looks for plugins only beside itself (GStreamer relocates its plugin dir from where libgstreamer
# loaded). Qt Multimedia's default GStreamer backend then finds no `queue`, `decodebin` or
# `videoconvert` inside the AppImage and crashes. Qt's FFmpeg backend has its codec libraries in its
# own link closure, which linuxdeploy bundles, so the AppImage selects that one. A QT_MEDIA_BACKEND
# the user already set still wins.
[[package.metadata.day.appimage.env]]
toolkit = "qt"
name = "QT_MEDIA_BACKEND"
value = "ffmpeg"
