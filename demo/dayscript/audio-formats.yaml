name: audio-formats
description: Isolate cold WAV playback, rate changes, and MP4/WAV replacement. Run in a fresh app process.
flow:
  - tap: { id: show-audio }
  # A fresh session starts at 1x. This distinguishes WAV/device failure from a
  # failure caused by the walkthrough's earlier source replacement or 1.25x rate.
  - tap: { id: session-replace }
  - assert_text: { id: session-source, key: source_replaced }
  - assert_text: { id: session-state, key: state_playing }
  - screenshot: audio-cold-wav
  - tap: { id: session-pause }
  - assert_text: { id: session-state, key: state_paused }
  - assert_text: { id: session-seek-capability, key: seek_ready }
  - tap: { id: session-seek }
  - assert_text: { id: session-seek-result, key: seek_confirmed }
  - tap: { id: session-fast }
  - assert_text: { id: session-rate-result, key: speed_confirmed }
  - tap: { id: session-play }
  - assert_text: { id: session-state, key: state_playing }
  - tap: { id: session-start }
  - assert_text: { id: session-state, key: state_playing }
  - assert_text: { id: session-source, key: source_original }
  - tap: { id: session-replace }
  - assert_text: { id: session-source, key: source_replaced }
  - assert_text: { id: session-state, key: state_playing }
  - assert_text: { id: session-rate-result, key: speed_confirmed }
  - screenshot: audio-replaced-wav-at-speed
  - tap: { id: session-stop }
  - assert_text: { id: session-state, key: state_idle }
