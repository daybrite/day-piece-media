name: audio-formats
description: Isolate cold WAV playback, rate changes, and MP4/WAV replacement. Run in a fresh app process.
flow:
  - tap: { id: show_audio }
  # A fresh session starts at 1x. This distinguishes WAV/device failure from a
  # failure caused by the walkthrough's earlier source replacement or 1.25x rate.
  - tap: { id: session_replace }
  - assert_text: { id: session_source, key: source_replaced }
  - assert_text: { id: session_state, key: state_playing }
  - screenshot: audio-cold-wav
  - tap: { id: session_pause }
  - assert_text: { id: session_state, key: state_paused }
  - assert_text: { id: session_seek_capability, key: seek_ready }
  - tap: { id: session_seek }
  - assert_text: { id: session_seek_result, key: seek_confirmed }
  - tap: { id: session_fast }
  - assert_text: { id: session_rate_result, key: speed_confirmed }
  - tap: { id: session_play }
  - assert_text: { id: session_state, key: state_playing }
  - tap: { id: session_start }
  - assert_text: { id: session_state, key: state_playing }
  - assert_text: { id: session_source, key: source_original }
  - tap: { id: session_replace }
  - assert_text: { id: session_source, key: source_replaced }
  - assert_text: { id: session_state, key: state_playing }
  - assert_text: { id: session_rate_result, key: speed_confirmed }
  - screenshot: audio-replaced-wav-at-speed
  - tap: { id: session_stop }
  - assert_text: { id: session_state, key: state_idle }
