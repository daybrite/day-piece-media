name: android-audio-recreation
description: Keep an application-owned audio player through Android activity recreation.
flow:
  - tap: { id: show-audio }
  - tap: { id: session-start }
  - assert_text: { id: session-state, key: state_playing }
  - assert_text: { id: session-seek-capability, key: seek_ready }
  - tap: { id: switch-appearance }
  # Day rebuilds the whole activity tree after an appearance change. The native audio player,
  # session observers and app-owned handle must survive and the new controls must reconnect.
  - wait_for: { id: show-audio }
  - tap: { id: show-audio }
  - assert_text: { id: session-state, key: state_playing }
  - tap: { id: session-pause }
  - assert_text: { id: session-state, key: state_paused }
  - tap: { id: session-seek }
  - assert_text: { id: session-seek-result, key: seek_confirmed }
  - screenshot: shared-audio-after-recreation
  - tap: { id: session-stop }
  - assert_text: { id: session-state, key: state_idle }
